<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PO Checker - Warehouse Receiving</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="app-bar">
        <h1>PO Checker</h1>
        <div class="app-bar-actions">
            <button class="icon-btn" id="refresh-btn" title="Refresh">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
        </div>
    </header>

    <nav class="nav-tabs">
        <a href="/" class="nav-tab active">PO List</a>
        <a href="/settings.html" class="nav-tab">Settings</a>
    </nav>

    <main class="container page-content">
        <!-- Resume Session Modal -->
        <div id="resume-modal" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2 class="modal-title">Resume Session?</h2>
                </div>
                <div class="modal-body">
                    <p>You have an in-progress receiving session for:</p>
                    <div class="card mt-16">
                        <div class="po-number" id="resume-po-number"></div>
                        <div class="po-supplier" id="resume-supplier"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" id="resume-cancel">Start New</button>
                    <button class="btn btn-primary" id="resume-continue">Resume</button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <section class="filters collapsed" id="filters-section">
            <div class="filters-header" id="filters-toggle">
                <div class="filters-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    Filters
                </div>
                <svg class="filters-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="filters-content">
                <div class="form-group">
                    <label class="form-label">Supplier</label>
                    <select class="form-select" id="filter-supplier">
                        <option value="">All Suppliers</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">From Date</label>
                        <input type="date" class="form-input" id="filter-date-from">
                    </div>
                    <div class="form-group">
                        <label class="form-label">To Date</label>
                        <input type="date" class="form-input" id="filter-date-to">
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="alert alert-error hidden"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-title">No Open POs</div>
            <div class="empty-state-desc">There are no open purchase orders to receive.</div>
        </div>

        <!-- Config Required State -->
        <div id="config-state" class="empty-state hidden">
            <div class="empty-state-icon">⚙️</div>
            <div class="empty-state-title">Configuration Required</div>
            <div class="empty-state-desc">Please configure the S2S database connection in Settings.</div>
            <a href="/settings.html" class="btn btn-primary mt-16">Go to Settings</a>
        </div>

        <!-- PO List -->
        <ul id="po-list" class="po-list"></ul>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/js/po-list.js"></script>
</body>
</html>
