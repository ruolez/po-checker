<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings - PO Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Floating Back Icon -->
    <div class="floating-icon left">
        <a href="/" class="icon-btn" title="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
    </div>

    <main class="container page-content">
        <h1 class="page-title">Settings</h1>
        <!-- S2S Database Connection -->
        <section class="settings-section">
            <div class="settings-section-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
                S2S Database (Purchase Orders)
            </div>
            <div class="settings-section-body">
                <div id="s2s-status" class="connection-status disconnected mb-16">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>Not configured</span>
                </div>

                <form id="s2s-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Server / Host</label>
                            <input type="text" class="form-input" id="s2s-server" placeholder="192.168.1.100" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Port</label>
                            <input type="number" class="form-input" id="s2s-port" placeholder="1433" value="1433">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Database Name</label>
                        <input type="text" class="form-input" id="s2s-database" placeholder="S2S" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="s2s-username" placeholder="sa" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="s2s-password" placeholder="********" required>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-outline" id="s2s-test">Test Connection</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ShipperDB Connection (Case Barcodes) -->
        <section class="settings-section">
            <div class="settings-section-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                ShipperDB (Case Barcodes)
            </div>
            <div class="settings-section-body">
                <div id="shipper-status" class="connection-status disconnected mb-16">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                    </svg>
                    <span>Not configured</span>
                </div>

                <form id="shipper-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Server / Host</label>
                            <input type="text" class="form-input" id="shipper-server" placeholder="192.168.1.101" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Port</label>
                            <input type="number" class="form-input" id="shipper-port" placeholder="1433" value="1433">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Database Name</label>
                        <input type="text" class="form-input" id="shipper-database" placeholder="ShipperDB" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Table Name</label>
                        <input type="text" class="form-input" id="shipper-table" placeholder="case_barcodes" value="case_barcodes">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="shipper-username" placeholder="sa" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="shipper-password" placeholder="********" required>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-outline" id="shipper-test">Test Connection</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Excluded Products -->
        <section class="settings-section">
            <div class="settings-section-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                Excluded Products
            </div>
            <div class="settings-section-body">
                <p class="section-desc">Products excluded from PO checking. Click Restore to include them again.</p>
                <div id="excluded-list" class="excluded-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/js/settings.js"></script>
</body>
</html>
