services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - po-checker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/app:/app/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://pochecker:pochecker@postgres:5432/pochecker
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - po-checker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/public:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - po-checker-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=pochecker
      - POSTGRES_PASSWORD=pochecker
      - POSTGRES_DB=pochecker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pochecker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - po-checker-network

volumes:
  postgres_data:

networks:
  po-checker-network:
    driver: bridge
